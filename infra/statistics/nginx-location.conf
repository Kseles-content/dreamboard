location = /dreamboard-api/events {
    limit_req zone=dreamboard_statistics burst=10 nodelay;
    limit_req zone=dreamboard_statistics_total burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 256;
    client_body_timeout 4s;
    proxy_pass http://127.0.0.1:8788/events;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Referer "";
    proxy_read_timeout 5s;
    access_log off;
    error_log /dev/null crit;
}
