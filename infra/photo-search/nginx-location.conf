# Include inside the existing HTTPS server block for kseles.ru (127.0.0.1:8444).
# First install nginx-limit.conf in the nginx http context.
location = /dreamboard-api/photos {
    limit_req zone=dreamboard_photo_search burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787/api/photos;
    proxy_http_version 1.1;
    proxy_set_header Origin $http_origin;
    proxy_set_header Host $host;
    proxy_read_timeout 12s;
    # Do not retain users' search terms in access logs.
    access_log off;
}
